[platformio]
default_envs = sensecap-meshcore
boards_dir = ../boards

[env:sensecap-meshcore]
platform = https://github.com/meshtastic/pioarduino-platform-espressif32/archive/refs/heads/55.03.311.zip
framework = arduino
board = seeed-sensecap-indicator
board_build.partitions = ../partition-table-cairn-resident.csv
board_build.app_partition_name = meshcore
board_build.filesystem = spiffs
board_build.filesystem_partition = mcfs
platform_packages =
  platformio/framework-arduinoespressif32 @ https://github.com/mverch67/arduino-esp32#6dde0f3b58e32d9f884b94b4685b0f3a267c4624
extra_scripts = pre:build_dependencies.py
  post:resident_upload.py
monitor_speed = 115200
upload_speed = 115200
build_flags =
  -Wl,--wrap=nvs_open
  -Wl,--wrap=esp_mbedtls_mem_calloc
  -Iui
  -Isrc
  -I../src
  -I../src/mesh
  -I../src/mesh/generated
  -I../lib/device-ui/include
  -I.pio/libdeps/$PIOENV/MeshCore/examples/companion_radio
  -D HAMVIEW_MUI=1
  -D CAIRN_MUI=1
  -D CAIRN_CORE_PROFILE=1
  -D CAIRN_SQUARE_LAYOUT=1
  -D SENSECAP_INDICATOR=1
  -D SENSOR_RP2040_TXD=19
  -D SENSOR_RP2040_RXD=20
  -D SENSOR_BAUD_RATE=2000000
  -D ARCH_ESP32=1
  -D HAS_TFT=1
  -D LV_CONF_INCLUDE_SIMPLE
  -D CUSTOM_TOUCH_DRIVER
  -D ESP32_PLATFORM
  -D BUILD_EXAMPLE=companion_radio
  -D EXCLUDE_FROM_EXAMPLE=main.cpp
  -D RADIOLIB_STATIC_ONLY=1
  -D RADIOLIB_GODMODE=1
  -D USE_ARDUINO_HAL_GPIO
  -D IO_EXPANDER=0x40
  -D IO_EXPANDER_IRQ=42
  -D PIN_BOARD_SDA=39
  -D PIN_BOARD_SCL=40
  -D PIN_USER_BTN=38
  -D P_LORA_SCLK=41
  -D P_LORA_MISO=47
  -D P_LORA_MOSI=48
  -D P_LORA_NSS=64
  -D P_LORA_RESET=65
  -D P_LORA_BUSY=66
  -D P_LORA_DIO_1=67
  -D USE_SX1262
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=2.4
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D LORA_FREQ=910.525
  -D LORA_BW=62.5
  -D LORA_SF=7
  -D LORA_CR=5
  -D LORA_TX_POWER=20
  -D MAX_CONTACTS=100
  -D MAX_GROUP_CHANNELS=40
  -D ENV_INCLUDE_RAK12035=0
lib_deps =
  bblanchon/ArduinoJson @ 7.4.3
  https://github.com/nanopb/nanopb/archive/0.4.92.zip
  lvgl/lvgl @ 9.3.0
  https://github.com/mverch67/LovyanGFX/archive/9abe502add013f392a1898d7dc48d65ddc112754.zip
  https://github.com/mverch67/bb_captouch/archive/8626412fe650d808a267791c0eae6e5860c85a5d.zip
  densaugeo/base64 @ 1.4.0
  jgromes/RadioLib @ 7.7.1
  https://github.com/meshcore-dev/MeshCore.git#81dbae592ffad40b4212bc0b37e82b38da08f4bc

[env:sensecap-meshcore-public]
extends = env:sensecap-meshcore
build_flags =
  ${env:sensecap-meshcore.build_flags}
  -D CAIRN_PUBLIC_RELEASE=1
